<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="100%" height="100%" viewBox="0 0 44 44" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;">
    <!-- Base Horizontal Axis Line -->
    <path d="M 4 40 L 40 40" fill="none" stroke="currentColor" stroke-width="2.5"/>
    
    <!-- Bar 1 (Left) -->
    <rect x="7" y="32" width="6" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="2.5"/>
    
    <!-- Bar 2 (Center) -->
    <rect x="19" y="26" width="6" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2.5"/>
    
    <!-- Bar 3 (Right) -->
    <rect x="31" y="20" width="6" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2.5"/>
    
    <!-- Upward Trend Line (Afastada com amplo respiro sobre as barras) -->
    <path d="M 4 20 L 38 4" fill="none" stroke="currentColor" stroke-width="2.5"/>
    
    <!-- Arrow Head -->
    <path d="M 29 4 L 38 4 L 38 13" fill="none" stroke="currentColor" stroke-width="2.5"/>
</svg>
